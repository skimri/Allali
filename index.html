<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Laura Allali | Illustrator</title>
  <meta name="description" content="Portfolio of Laura Allali, illustrator. Artwork, projects, and contact." />
  <link rel="icon" type="image/png" href="assets/ico.png" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="grain" aria-hidden="true"></div>
  <header class="site-header" aria-label="Primary navigation">
    <a class="logo" href="index.html" aria-label="Laura Allali home">
      <img class="logo-icon" src="assets/ico-transparent.png" alt="" aria-hidden="true" />
      <img class="logo-image" src="assets/logo.png" alt="Laura Allali illustrator logo" />
    </a>
    <nav>
      <a href="#gallery">Gallery</a>
      <a href="about/index.html">About</a>
      <a href="contact/index.html">Contact</a>
    </nav>
  </header>

  <main>
    <section class="hero" id="home">
      <img src="assets/img/LUCA 1st year (self-portrait series)/Graphite - Colored pencils/IMG_0634.JPG.webp" alt="Featured artwork by Laura Allali" loading="eager" fetchpriority="high" decoding="async" />
    </section>

    <section class="gallery" id="gallery" aria-label="Artwork gallery">
      <div class="gallery-heading">
        <h2>Browse Galleries</h2>
        <p>Explore every artwork grouped by school year and series.</p>
      </div>

      <div class="art-grid">
        <a class="tile gallery-link" href="gallery/De!-Kunsthumaniora-Antwerpen/index.html" aria-label="Open De Kunsthumaniora Antwerpen gallery">
          <img src="assets/img/De! Kunsthumaniora Antwerpen/Graphite - Charcoal/IMG_0689.JPG.thumb.webp" alt="De Kunsthumaniora Antwerpen gallery cover" loading="lazy" decoding="async" />
          <span>De! Kunsthumaniora Antwerpen(2019-2023)</span>
        </a>
        <a class="tile gallery-link" href="gallery/LUCA-1st-year/index.html" aria-label="Open LUCA 1st year self-portrait series gallery">
          <img src="assets/img/LUCA 1st year (self-portrait series)/Graphite - Colored pencils/IMG_0634.JPG.thumb.webp" alt="LUCA 1st year self-portrait series gallery cover" loading="lazy" decoding="async" />
          <span>LUCA 1st year (2023-2024)</span>
        </a>
        <a class="tile gallery-link" href="gallery/LUCA-2nd-year/index.html" aria-label="Open LUCA 2nd year gallery">
          <img src="assets/img/LUCA 2nd year/Monotype/IMG_0683.JPG.thumb.webp" alt="LUCA 2nd year gallery cover" loading="lazy" decoding="async" />
          <span>LUCA 2nd year(2024-2025)</span>
        </a>
        <a class="tile gallery-link" href="gallery/LUCA-3rd-year/index.html" aria-label="Open LUCA 3rd year gallery">
          <img src="assets/img/LUCA 3rd year/Ernesto/img20260429_16032270.thumb.webp" alt="LUCA 3rd year gallery cover" loading="lazy" decoding="async" />
          <span>LUCA 3rd year (2025-2026)</span>
        </a>
        <a class="tile gallery-link" href="gallery/LUCA-Sketchbook/index.html" aria-label="Open LUCA Sketchbook gallery">
          <img src="assets/img/LUCA Sketchbook/ARTEFICTION KMKG Brussel/IMG_0726.thumb.webp" alt="LUCA Sketchbook gallery cover" loading="lazy" decoding="async" />
          <span>LUCA Sketchbook</span>
        </a>
        <a class="tile gallery-link" href="gallery/Model-Drawing/index.html" aria-label="Open model drawing gallery">
          <img src="assets/img/Model drawing/IMG_0668.JPG-cover.thumb.webp" alt="Model drawing gallery cover" loading="lazy" decoding="async" />
          <span>Model drawing</span>
        </a>
      </div>
    </section>
  </main>

  <footer class="site-footer" aria-label="Site footer">
    <img src="assets/footer.png" alt="Laura Allali footer logo" />
  </footer>

  <script src="script.js"></script>
</body>
</html>
